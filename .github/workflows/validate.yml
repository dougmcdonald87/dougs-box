name: Validate

# Static validation: YAML, PowerShell parse, config tests, secret scan,
# action pinning, append-only law. Run on every push to main - it saves money
# to catch breakage here before burning a Windows runner hour. Zero secrets.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static gates (no operational secrets used or needed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate every YAML document parses
        shell: python {0}
        run: |
          import sys, pathlib
          try:
              import yaml
          except ImportError:
              sys.exit("pyyaml missing from runner image? pip install pyyaml in a prior step; image normally ships it.")
          for p in pathlib.Path('.').rglob('*.y*ml'):
              if '/node_modules/' in str(p): continue
              list(yaml.safe_load_all(p.read_text(encoding='utf-8-sig')))
              print(f"YAML OK   {p}")

      - name: Parse every PowerShell file (AST)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = 0
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $bad++; Write-Host "PS FAIL  $($_.FullName)"; $errors | ForEach-Object { Write-Host "   $($_.Message) @ line $($_.Extent.StartLineNumber)" } }
            else { Write-Host "PS OK    $($_.FullName)" }
          }
          if ($bad) { exit 1 }

      - name: Run retry-helper regression tests
        shell: pwsh
        run: ./tests/retry-strictmode.tests.ps1

      - name: Verify read-only audit mode cannot start or cancel desktop
        shell: bash
        run: python3 tests/opencode-audit-workflow.tests.py

      - name: Adversarial duplicate-start and queued-run checks
        shell: bash
        run: python3 tests/guard-one-session.tests.py

      - name: Adversarial staged cross-drive restore tests
        shell: pwsh
        run: ./tests/cross-drive.tests.ps1

      - name: Adversarial SQLite history snapshot consistency
        shell: bash
        run: python3 tests/opencode-history.tests.py

      - name: Adversarial user-stop control regression
        shell: pwsh
        run: ./tests/control-queue.tests.ps1

      - name: Append-only law + data-loss audit
        # Phase 41: destructive commands must appear in ZERO code files.
        # Scope = code (.ps1/.psd1/.json). The two enforcement artifacts are
        # deliberately excluded from this grep because their whole purpose is
        # to name the forbidden vocabulary in patterns:
        #   .github/workflows/validate.yml (this file's own grep pattern)
        #   tests/devbox.tests.ps1         (unit-mirror of the same audit)
        # Docs (.md) may state the law; the grep scans code only.
        shell: bash
        run: |
          set -euo pipefail
          if grep -rniE '(^|[^a-z])(forget|prune)([^a-z]|$)' \
              --include='*.ps1' --include='*.yml' --include='*.json' \
              --exclude='validate.yml' --exclude='devbox.tests.ps1' . ; then
            echo "AUDIT FAIL: destructive-restore vocabulary found in code above."
            exit 1
          fi
          if grep -rn -- '--delete' --include='*.ps1' --exclude='devbox.tests.ps1' . ; then
            echo "AUDIT FAIL: destructive restore --delete in a script."
            exit 1
          fi
          echo "AUDIT OK: destructive-restore vocabulary absent from scanned code."

  windows-installer-smoke:
    name: Live Windows OpenCode installer (isolated runner)
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install actual OpenCode on clean Windows runner
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DEVBOX_WSROOT = Join-Path $env:RUNNER_TEMP 'DevBox-QA'
          $env:DEVBOX_CONTROL_PATH = Join-Path $env:DEVBOX_WSROOT 'Control'
          New-Item -ItemType Directory -Path $env:DEVBOX_CONTROL_PATH -Force | Out-Null
          $toolsRoot = Join-Path $env:DEVBOX_WSROOT 'Tools'
          ./scripts/install-opencode.ps1 -ToolsRoot $toolsRoot
          $exe = Get-ChildItem -LiteralPath $toolsRoot -Filter 'opencode.exe' -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Installer returned but opencode.exe was not installed.' }
          $found = (& $exe.FullName --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $found -ne 'opencode v2.0.24') {
            throw "Expected OpenCode v2.0.24, but Windows executable returned '$found' (exit $LASTEXITCODE)."
          }
          Write-Output 'WINDOWS OPENCODE V2 INSTALL SMOKE: PASS'

  windows-control-links:
    name: Windows RDP desktop shortcut smoke (disposable runner)
    runs-on: windows-2025-vs2026
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Adversarial UK timezone and DST transition on disposable Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $original = (& tzutil.exe /g | Out-String).Trim()
          if (-not $original) { throw 'Could not read original timezone.' }
          try {
            # Deliberately start with the wrong timezone, including no BST shift.
            & tzutil.exe /s 'UTC'
            if ($LASTEXITCODE -ne 0) { throw 'Could not establish false UTC baseline.' }
            [TimeZoneInfo]::ClearCachedData()
            $before = [TimeZoneInfo]::Local
            $july = [datetime]::SpecifyKind([datetime]'2026-07-15T12:00:00', [DateTimeKind]::Utc)
            if ($before.Id -ne 'UTC' -or $before.GetUtcOffset($july).TotalMinutes -ne 0) {
              throw 'Falsifier baseline not established.'
            }
            Write-Output 'COUNTEREXAMPLE: UTC baseline is wrong for July BST.'
            ./scripts/configure-timezone.ps1
            if ($LASTEXITCODE -ne 0) { throw 'Timezone setup script failed.' }
            $after = (& tzutil.exe /g | Out-String).Trim()
            [TimeZoneInfo]::ClearCachedData()
            if ($after -ne 'GMT Standard Time' -or [TimeZoneInfo]::Local.GetUtcOffset($july).TotalMinutes -ne 60) {
              throw 'Timezone script did not fix winter/summer distinction.'
            }
            Write-Output 'WINDOWS UK TIMEZONE + DST ADVERSARIAL TEST: PASS'
          } finally {
            & tzutil.exe /s $original
            [TimeZoneInfo]::ClearCachedData()
            if ($LASTEXITCODE -ne 0) { throw 'Failed restoring test runner original timezone.' }
          }

      - name: Install and inspect both public desktop shortcuts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DEVBOX_WSROOT = Join-Path $env:RUNNER_TEMP 'DevBox-Control-Desktop-QA'
          $control = Join-Path $env:DEVBOX_WSROOT 'Control'
          New-Item -ItemType Directory -Path $control -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $env:DEVBOX_WSROOT 'Workspace') -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $control 'session.json') -Value '{}' -Encoding ascii
          ./scripts/install-desktop-controls.ps1
          $desktop = [Environment]::GetFolderPath('CommonDesktopDirectory')
          $shell = New-Object -ComObject WScript.Shell
          foreach ($name in @('Save DevBox State Now','Finish DevBox Safely')) {
            $link = Join-Path $desktop "$name.lnk"
            if (-not (Test-Path -LiteralPath $link)) { throw "Desktop control missing: $name" }
            $shortcut = $shell.CreateShortcut($link)
            if ($shortcut.Arguments -notlike '*request-control.ps1*') { throw "Unexpected shortcut target for $name" }
            Write-Output "CONTROL SHORTCUT CONFIRMED: $name"
          }
          Write-Output 'WINDOWS DESKTOP CONTROL SMOKE: PASS'

  windows-backup-restore:
    name: Windows real Restic backup and restore (isolated local repo)
    runs-on: windows-2025-vs2026
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify actual DevBox snapshot and working file recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DEVBOX_ISOLATED_TEST = '1'
          $env:DEVBOX_WSROOT = Join-Path $env:RUNNER_TEMP 'DevBox-Storage-QA'
          $env:DEVBOX_CONTROL_PATH = Join-Path $env:DEVBOX_WSROOT 'Control'
          $env:RESTIC_PASSWORD = 'CI-only-dummy-restic-encryption-key'
          $env:GITHUB_RUN_ID = 'ci-isolated-test'
          $env:DEVBOX_RESTIC_EXE = Join-Path $env:DEVBOX_WSROOT 'Tools\restic\restic.exe'
          $repo = Join-Path $env:RUNNER_TEMP 'DevBox-Isolated-Restic-Repo'
          New-Item -ItemType Directory -Path $env:DEVBOX_CONTROL_PATH -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $env:DEVBOX_WSROOT 'Temp') -Force | Out-Null
          $projectsDir = New-Item -ItemType Directory -Path (Join-Path $env:DEVBOX_WSROOT 'Projects') -Force
          $workspaceDir = New-Item -ItemType Directory -Path (Join-Path $env:DEVBOX_WSROOT 'Workspace') -Force
          Set-Content -LiteralPath (Join-Path $projectsDir.FullName 'PROJECT-TEST.txt') -Value 'persist me: project' -Encoding ascii
          Set-Content -LiteralPath (Join-Path $workspaceDir.FullName 'WORKSPACE-TEST.txt') -Value 'persist me: workspace' -Encoding ascii
          @{ repoUrl = $repo; storageIp = 'test-only-loopback' } | ConvertTo-Json |
            Set-Content -LiteralPath (Join-Path $env:DEVBOX_CONTROL_PATH 'persistence.json') -Encoding utf8
          ./scripts/install-restic.ps1 -ToolsRoot (Split-Path $env:DEVBOX_RESTIC_EXE -Parent)
          # Simulate an OpenCode v2 session DB that must survive a new runner.
          $env:OPENCODE_CI_DB = Join-Path $env:USERPROFILE '.local\share\opencode\opencode.db'
          New-Item -ItemType Directory -Path (Split-Path $env:OPENCODE_CI_DB -Parent) -Force | Out-Null
          python -c "import os,sqlite3; p=os.environ['OPENCODE_CI_DB']; c=sqlite3.connect(p); c.execute('CREATE TABLE sessions (id TEXT)'); c.execute('INSERT INTO sessions VALUES (?)', ('important-session',)); c.commit(); c.close()"
          Set-Content -LiteralPath (Join-Path (Split-Path $env:OPENCODE_CI_DB -Parent) 'auth.json') -Value 'FAKE-TEST-AUTH-NEVER-BACKUP'
          ./scripts/restore-state.ps1
          ./scripts/save-state.ps1 -First
          if (-not (Test-Path -LiteralPath (Join-Path $env:DEVBOX_CONTROL_PATH 'last-backup.json'))) {
            throw 'Verified snapshot metadata was not produced.'
          }
          Remove-Item -LiteralPath (Join-Path $projectsDir.FullName 'PROJECT-TEST.txt') -Force
          Remove-Item -LiteralPath (Join-Path $workspaceDir.FullName 'WORKSPACE-TEST.txt') -Force
          Remove-Item -LiteralPath $env:OPENCODE_CI_DB -Force
          Remove-Item -LiteralPath (Join-Path (Split-Path $env:OPENCODE_CI_DB -Parent) 'auth.json') -Force
          ./scripts/restore-state.ps1
          if (-not (Test-Path -LiteralPath $env:OPENCODE_CI_DB -PathType Leaf)) { throw 'OpenCode DB NOT restored.' }
          python -c "import os,sqlite3; c=sqlite3.connect(os.environ['OPENCODE_CI_DB']); assert c.execute('SELECT id FROM sessions').fetchall() == [('important-session',)]; c.close()"
          if ($LASTEXITCODE -ne 0) { throw 'OpenCode session row missing or database corrupted.' }
          if (Test-Path -LiteralPath (Join-Path (Split-Path $env:OPENCODE_CI_DB -Parent) 'auth.json')) { throw 'OpenCode auth.json was persisted against policy.' }
          Write-Output 'WINDOWS OPENCODE HISTORY RESTORE WITHOUT AUTH: PASS'
          # Isolated Windows real-files test: the previous runner's D:\DevBox
          # stage must be findable even when the current runner's root differs.
          $differentDriveStage = Join-Path $env:RUNNER_TEMP 'DevBox-Former-Drive-Stage'
          New-Item -ItemType Directory -Path (Join-Path $differentDriveStage 'D\DevBox\Projects') -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $differentDriveStage 'D\DevBox\Projects\DRIVE-SWITCH-PROOF.txt') -Value 'previous-D-drive'
          . ./scripts/find-staged-work.ps1
          $foundOld = Find-DevBoxStagedWork -StagingRoot $differentDriveStage -Name Projects -SnapshotPaths @('D:\DevBox\Projects')
          if (-not $foundOld) { throw 'Previous D drive Projects were not located.' }
          $restoredProof = Join-Path $env:DEVBOX_WSROOT 'Projects\DRIVE-SWITCH-PROOF.txt'
          Copy-Item -LiteralPath (Join-Path $foundOld 'DRIVE-SWITCH-PROOF.txt') -Destination $restoredProof -Force
          if ((Get-Content -LiteralPath $restoredProof -Raw).Trim() -ne 'previous-D-drive') {
            throw 'Cross-drive project content mismatch.'
          }
          Write-Output 'WINDOWS CROSS-DRIVE STAGING INTEGRATION: PASS'
          if ((Get-Content -LiteralPath (Join-Path $projectsDir.FullName 'PROJECT-TEST.txt') -Raw).Trim() -ne 'persist me: project') { throw 'Project was NOT restored.' }
          if ((Get-Content -LiteralPath (Join-Path $workspaceDir.FullName 'WORKSPACE-TEST.txt') -Raw).Trim() -ne 'persist me: workspace') { throw 'Workspace was NOT restored.' }
          Write-Output 'WINDOWS RESTIC BACKUP AND REAL WORK RECOVERY: PASS'
          # Strongest cheap integration attack: STOP must invoke the real restic
          # save-state.ps1 against this disposable local encrypted repository.
          . ./scripts/control-queue.ps1
          $commands = Join-Path $env:DEVBOX_CONTROL_PATH 'Commands'
          New-Item -ItemType Directory -Path $commands -Force | Out-Null
          $id = [guid]::NewGuid().ToString('N')
          Set-Content -LiteralPath (Join-Path $commands "stop-$id.request") -Value 'real-restic-test' -Encoding ascii
          $stop = Invoke-DevBoxControlRequests -ControlPath $env:DEVBOX_CONTROL_PATH -VerifiedSave {
            param([string]$action)
            ./scripts/save-state.ps1
            return ($LASTEXITCODE -eq 0)
          }
          if (-not $stop) { throw 'Real verified Restic snapshot failed to approve STOP.' }
          $result = Get-Content -LiteralPath (Join-Path $commands "stop-$id.result.json") -Raw | ConvertFrom-Json
          if (-not $result.success -or -not $result.snapshotId) {
            throw 'STOP claimed success without a new real Restic snapshot.'
          }
          Write-Output 'WINDOWS REAL RESTIC -> SAFE STOP INTEGRATION: PASS'


  windows-devbox-stages:
    name: Windows stage smoke - Restic, RDP and firewall
    runs-on: windows-2025-vs2026
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install and verify real Restic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DEVBOX_WSROOT = Join-Path $env:RUNNER_TEMP 'DevBox-QA'
          $env:DEVBOX_CONTROL_PATH = Join-Path $env:DEVBOX_WSROOT 'Control'
          New-Item -ItemType Directory -Path $env:DEVBOX_CONTROL_PATH -Force | Out-Null
          $path = Join-Path $env:DEVBOX_WSROOT 'Tools\restic'
          ./scripts/install-restic.ps1 -ToolsRoot $path
          & (Join-Path $path 'restic.exe') version
          if ($LASTEXITCODE -ne 0) { throw 'Installed restic failed on Windows.' }
          "DEVBOX_WSROOT=$env:DEVBOX_WSROOT" >> $env:GITHUB_ENV
          "DEVBOX_CONTROL_PATH=$env:DEVBOX_CONTROL_PATH" >> $env:GITHUB_ENV
          Write-Output 'WINDOWS RESTIC INSTALL: PASS'
      - name: Configure real RDP on disposable Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $password = ConvertTo-SecureString -String 'RunOnly!Dbx2026#Test' -AsPlainText -Force
          ./scripts/configure-rdp.ps1 -Password $password
          $nla = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp').UserAuthentication
          if ($nla -ne 1) { throw 'RDP NLA not enabled.' }
          $listener = @(Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue)
          if ($listener.Count -eq 0) { throw 'No TCP 3389 listener.' }
          foreach ($rule in @(Get-NetFirewallRule -DisplayGroup 'Remote Desktop')) {
            if ($rule.Enabled -ne 'True') { continue }
            $filter = $rule | Get-NetFirewallAddressFilter
            $ranges = @($filter.RemoteAddress)
            Write-Output "Firewall RDP rule $($rule.Name): allowed=$($ranges -join ',')"
            if ($ranges -contains 'Any' -or $ranges -contains '0.0.0.0/0') {
              throw 'Enabled RDP firewall rule permits public source addresses.'
            }
            if (-not ($ranges | Where-Object { $_ -in @('100.64.0.0/10','100.64.0.0/255.192.0.0') })) {
              throw 'Enabled RDP firewall rule does not match the Tailscale-only source range.'
            }
          }
          Write-Output 'WINDOWS RDP CONFIGURATION: PASS'
      - name: Prove session startup readiness without tailnet or backup side effects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DEVBOX_ISOLATED_TEST = '1'
          $env:RESTIC_PASSWORD = 'CI-only-session-smoke-dummy'
          $ocFolder = Join-Path $env:DEVBOX_WSROOT 'Tools\OpenCode'
          New-Item -ItemType Directory -Path $ocFolder -Force | Out-Null
          New-Item -ItemType File -Path (Join-Path $ocFolder 'opencode.exe') -Force | Out-Null
          @{
            startedUtc = [DateTime]::UtcNow.ToString('o')
            workspaceRoot = $env:DEVBOX_WSROOT
            readyTargetMinutes = 60
            jobHardLimitMinutes = 120
            backupIntervalMin = 10
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:DEVBOX_CONTROL_PATH 'session.json')
          function global:tailscale {
            if ($args.Count -eq 2 -and $args[0] -eq 'status' -and $args[1] -eq '--json') {
              '{"Self":{"Tags":["tag:github-devbox"]}}'
            } else { throw 'Mock tailnet accepts status only.' }
          }
          ./scripts/session-manager.ps1 -JobStart -SmokeOnly
          if ($LASTEXITCODE -ne 0) { throw 'Session manager readiness smoke failed.' }
          Write-Output 'WINDOWS SESSION MANAGER READINESS SMOKE: PASS'
