name: Validate

# Static validation: YAML, PowerShell parse, config tests, secret scan,
# action pinning, append-only law. Run on every push to main - it saves money
# to catch breakage here before burning a Windows runner hour. Zero secrets.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static gates (no operational secrets used or needed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate every YAML document parses
        shell: python {0}
        run: |
          import sys, pathlib
          try:
              import yaml
          except ImportError:
              sys.exit("pyyaml missing from runner image? pip install pyyaml in a prior step; image normally ships it.")
          for p in pathlib.Path('.').rglob('*.y*ml'):
              if '/node_modules/' in str(p): continue
              list(yaml.safe_load_all(p.read_text(encoding='utf-8-sig')))
              print(f"YAML OK   {p}")

      - name: Parse every PowerShell file (AST)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = 0
          Get-ChildItem -Recurse -Include *.ps1,*.psm1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { $bad++; Write-Host "PS FAIL  $($_.FullName)"; $errors | ForEach-Object { Write-Host "   $($_.Message) @ line $($_.Extent.StartLineNumber)" } }
            else { Write-Host "PS OK    $($_.FullName)" }
          }
          if ($bad) { exit 1 }

      - name: Run retry-helper regression tests
        shell: pwsh
        run: ./tests/retry-strictmode.tests.ps1

      - name: Append-only law + data-loss audit
        # Phase 41: destructive commands must appear in ZERO code files.
        # Scope = code (.ps1/.psd1/.json). The two enforcement artifacts are
        # deliberately excluded from this grep because their whole purpose is
        # to name the forbidden vocabulary in patterns:
        #   .github/workflows/validate.yml (this file's own grep pattern)
        #   tests/devbox.tests.ps1         (unit-mirror of the same audit)
        # Docs (.md) may state the law; the grep scans code only.
        shell: bash
        run: |
          set -euo pipefail
          if grep -rniE '(^|[^a-z])(forget|prune)([^a-z]|$)' \
              --include='*.ps1' --include='*.yml' --include='*.json' \
              --exclude='validate.yml' --exclude='devbox.tests.ps1' . ; then
            echo "AUDIT FAIL: destructive-restore vocabulary found in code above."
            exit 1
          fi
          if grep -rn -- '--delete' --include='*.ps1' --exclude='devbox.tests.ps1' . ; then
            echo "AUDIT FAIL: destructive restore --delete in a script."
            exit 1
          fi
          echo "AUDIT OK: destructive-restore vocabulary absent from scanned code."

  windows-installer-smoke:
    name: Live Windows OpenCode installer (isolated runner)
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install actual OpenCode on clean Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DEVBOX_WSROOT = Join-Path $env:RUNNER_TEMP 'DevBox-QA'
          $env:DEVBOX_CONTROL_PATH = Join-Path $env:DEVBOX_WSROOT 'Control'
          New-Item -ItemType Directory -Path $env:DEVBOX_CONTROL_PATH -Force | Out-Null
          $toolsRoot = Join-Path $env:DEVBOX_WSROOT 'Tools'
          ./scripts/install-opencode.ps1 -ToolsRoot $toolsRoot
          $exe = Get-ChildItem -LiteralPath $toolsRoot -Filter 'opencode.exe' -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Installer returned but opencode.exe was not installed.' }
          & $exe.FullName --version
          if ($LASTEXITCODE -ne 0) { throw "Installed OpenCode failed on Windows: $LASTEXITCODE" }
          Write-Output 'WINDOWS OPENCODE INSTALL SMOKE: PASS'

  windows-devbox-stages:
    name: Windows stage smoke - Restic, RDP and firewall
    runs-on: windows-2025-vs2026
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install and verify real Restic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DEVBOX_WSROOT = Join-Path $env:RUNNER_TEMP 'DevBox-QA'
          $env:DEVBOX_CONTROL_PATH = Join-Path $env:DEVBOX_WSROOT 'Control'
          New-Item -ItemType Directory -Path $env:DEVBOX_CONTROL_PATH -Force | Out-Null
          $path = Join-Path $env:DEVBOX_WSROOT 'Tools\restic'
          ./scripts/install-restic.ps1 -ToolsRoot $path
          & (Join-Path $path 'restic.exe') version
          if ($LASTEXITCODE -ne 0) { throw 'Installed restic failed on Windows.' }
          "DEVBOX_WSROOT=$env:DEVBOX_WSROOT" >> $env:GITHUB_ENV
          "DEVBOX_CONTROL_PATH=$env:DEVBOX_CONTROL_PATH" >> $env:GITHUB_ENV
          Write-Output 'WINDOWS RESTIC INSTALL: PASS'
      - name: Configure real RDP on disposable Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $password = ConvertTo-SecureString -String 'RunOnly!Dbx2026#Test' -AsPlainText -Force
          ./scripts/configure-rdp.ps1 -Password $password
          $nla = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp').UserAuthentication
          if ($nla -ne 1) { throw 'RDP NLA not enabled.' }
          $listener = @(Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue)
          if ($listener.Count -eq 0) { throw 'No TCP 3389 listener.' }
          foreach ($rule in @(Get-NetFirewallRule -DisplayGroup 'Remote Desktop')) {
            if ($rule.Enabled -ne 'True') { continue }
            $filter = $rule | Get-NetFirewallAddressFilter
            if ($filter.RemoteAddress -notcontains '100.64.0.0/10') {
              throw 'Enabled RDP firewall rule is not restricted to Tailscale IP space.'
            }
          }
          Write-Output 'WINDOWS RDP CONFIGURATION: PASS'
