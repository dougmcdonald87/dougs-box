name: Recover existing Restic password (encrypted only)

# ONE-TIME, READ-ONLY RECOVERY.
#
# It does NOT restore, lock, prune or modify any Restic repository, and it does NOT
# create a new repository password. The EXISTING RESTIC_PASSWORD is read from the
# `devbox` environment, encrypted with the recovery PUBLIC key, and handed back only
# as CIPHERTEXT.
#
# WHY PUBLISHING THE PUBLIC KEY IS SAFE: a public key can only encrypt. The matching
# private key exists solely inside the recovery ZIP on Doug's laptop, so this artifact
# is useless to anybody else - which is exactly why the key was split in two. GitHub
# additionally masks the secret in logs; this workflow never echoes it, never puts it
# on a command line, and writes it only to a runner-local temp file that is deleted
# immediately after use and is destroyed with the ephemeral runner.
#
# RUN IT ON `main` - the `devbox` environment is restricted to protected branches.
# Then download the `restic-password-encrypted-once` artifact and run
# Unlock-ResticPassword.ps1 beside the private key, on the laptop.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    name: Encrypt the existing RESTIC_PASSWORD for local-only decryption
    runs-on: ubuntu-latest
    environment: devbox
    steps:
      - name: Encrypt with the recovery public key (plaintext never printed)
        env:
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          RECOVERY_PUBLIC_KEY_PEM_B64: ""
        run: |
          set -euo pipefail

          # The public key is decoded from one base64 line rather than checked in as a
          # file, so YAML indentation can never corrupt it.
          printf '%s' "$RECOVERY_PUBLIC_KEY_PEM_B64" | base64 -d > /tmp/recovery-public-key.pem

          echo "--- key identity check ---"
          computed=$(openssl pkey -pubin -in /tmp/recovery-public-key.pem -outform DER | openssl dgst -sha256 | awk '{print $NF}')
          expected=43e5465f147a0d128d0f798095168fe5ba3133983a875c9cd49d95114622de98
          echo "fingerprint computed: $computed"
          echo "fingerprint expected: $expected"
          if [ "$computed" != "$expected" ]; then
            echo "REFUSING: the embedded public key is not the published recovery key."
            exit 1
          fi

          if [ -z "${RESTIC_PASSWORD:-}" ]; then
            echo "REFUSING: RESTIC_PASSWORD is empty - is the devbox environment attached?"
            exit 1
          fi
          echo "secret present: length ${#RESTIC_PASSWORD} (value not printed)"

          umask 077
          printf '%s' "$RESTIC_PASSWORD" > /tmp/restic-password.txt

          # OAEP with SHA-1 and MGF1-SHA1 - exactly what
          # RSACryptoServiceProvider.Decrypt(ciphertext, $true) expects on Windows
          # PowerShell 5.1, which is the documented unlock tool.
          openssl pkeyutl -encrypt -pubin -inkey /tmp/recovery-public-key.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha1 \
            -pkeyopt rsa_mgf1_md:sha1 \
            -in /tmp/restic-password.txt -out restic-password.enc

          rm -f /tmp/restic-password.txt
          shred -u /tmp/restic-password.txt 2>/dev/null || true

          size=$(stat -c%s restic-password.enc)
          echo "ciphertext bytes: $size (expect 512 for a 4096-bit key)"
          if [ "$size" != "512" ]; then
            echo "REFUSING: ciphertext is not 512 bytes, so it is not a 4096-bit RSA block."
            exit 1
          fi
          echo "encrypted OK - the plaintext was never written to this log"

      - name: Upload the CIPHERTEXT only
        uses: actions/upload-artifact@v4
        with:
          name: restic-password-encrypted-once
          path: restic-password.enc
          if-no-files-found: error
          retention-days: 1