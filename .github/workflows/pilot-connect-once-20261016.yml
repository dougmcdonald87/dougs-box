# Single-use read-only disk inspection client for the existing retained pilot.
# Restricted to the pilot branch; never launches original DevBox or production workflows.
name: Inspect retained Home disk references
on:
  push:
    branches: [pilot/windows-home-connection-20261015]
    paths: ['.github/workflows/pilot-connect-once-20261016.yml']
permissions:
  contents: read
jobs:
  kickoff:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/pilot/windows-home-connection-20261015' &&
      github.event.head_commit.message == 'fix(pilot): run inspection from verified host checkout'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch one read-only client for the same retained host
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dougmcdonald87/dougs-box'
          test "$GITHUB_REF" = 'refs/heads/pilot/windows-home-connection-20261015'
          gh workflow run 'windows-state-probe-validate.yml' \
            --repo "$GH_REPO" \
            --ref 'pilot/windows-home-connection-20261015' \
            --field transfer_phase=live-host-probe \
            --field target_run=39073421057 \
            --field target_sha=80c15845ddc73b294f4edeb5b9475d2284e1e929
          echo 'PILOT_ONE_SHOT_RDP_PROBE_DISPATCH_ACCEPTED=true'

