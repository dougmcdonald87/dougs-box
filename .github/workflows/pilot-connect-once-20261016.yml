# Single-use owner-requested connection of the Windows 10 Home VM host.
# Restricted to the pilot branch; never launches original DevBox or production workflows.
name: One-time Windows 10 Home connection kickoff
on:
  push:
    branches: [pilot/windows-home-connection-20261015]
    paths: ['.github/workflows/pilot-connect-once-20261016.yml']
permissions:
  contents: read
jobs:
  kickoff:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/pilot/windows-home-connection-20261015' &&
      github.event.head_commit.message == 'chore(pilot): launch one Windows Home terminal pairing session'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch exactly one VM host and fresh Google pairing session
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dougmcdonald87/dougs-box'
          test "$GITHUB_REF" = 'refs/heads/pilot/windows-home-connection-20261015'
          gh workflow run 'windows-state-probe-validate.yml' \
            --repo "$GH_REPO" \
            --ref 'pilot/windows-home-connection-20261015' \
            --field transfer_phase=restore-hold \
            --field expected_generation=devbox-checkpoint-v1-ci-38647908553-1-20261014T225101Z-eb2366ef7dc34ea4aee45c30bbc721b6
          echo 'PILOT_ONE_SHOT_CONNECTION_DISPATCH_ACCEPTED=true'
