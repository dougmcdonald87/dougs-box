# Single-use owner-approved independent restore verification; no user VM changes.
# Restricted to the pilot branch; never launches original DevBox or production workflows.
name: Start isolated retained Home repair session
on:
  push:
    branches: [pilot/windows-home-connection-20261015]
    paths: ['.github/workflows/pilot-connect-once-20261016.yml']
permissions:
  contents: read
jobs:
  kickoff:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/pilot/windows-home-connection-20261015' &&
      github.event.head_commit.message == 'diagnose(pilot): capture native firewall scope before repair launch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch exactly one replacement connection probe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dougmcdonald87/dougs-box'
          test "$GITHUB_REF" = 'refs/heads/pilot/windows-home-connection-20261015'
          gh workflow run 'windows-state-probe-validate.yml' \
            --repo "$GH_REPO" \
            --ref 'pilot/windows-home-connection-20261015' \
            --field transfer_phase=repair-scope-probe \
            --field expected_generation=devbox-checkpoint-v1-ci-38930283997-1-20261016T200332Z-ae82c5cc06b2488787c87155d9134862 \
            --field expected_source_sha=21b49e1e87e93fb71b4ef8f736e459b5e86e530f
          echo 'PILOT_ONE_SHOT_RDP_PROBE_DISPATCH_ACCEPTED=true'

