name: DevBox

# MANUAL ONLY. V3 law: no push/PR/schedule triggers, no chaining.
# Owner launches this from Actions; approve the `devbox` Environment when asked.
# Cancel is EMERGENCY only - normal shutdown is "Finish DevBox Safely" on the desktop.
run-name: ${{ inputs.operation == 'inspect' && 'DevBox Archive Audit (Read Only)' || 'DevBox' }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Start remote desktop, or inspect old OpenCode backup metadata without changing any files'
        required: true
        type: choice
        default: start
        options:
          - start
          - inspect

permissions:
  contents: read
  id-token: write   # Tailscale Workload Identity Federation (OIDC)
  actions: read     # read-only single-session duplicate/admission guard

# A preflight guard rejects duplicate launches; the Windows job is serialized
# below without EVER cancelling an existing user's session.

# 350 min job timeout sits below the 360 min GitHub hard limit and leaves the
# session manager ~30 min of headroom under the interactive 5h20-5h30 target.
env:
  JOB_TIMEOUT_MINUTES: 350
  JOB_HARD_LIMIT_MINUTES: 360
  # This is the existing public Tailscale OIDC Client ID (not a secret).
  # Generated audience is api.tailscale.com/<full Client ID>.
  DEVBOX_OIDC_CLIENT_ID: 'Tf3m25iN2121CNTRL-k1fB6QfG2V11CNTRL'

jobs:
  preflight:
    if: ${{ inputs.operation != 'inspect' }}
    name: Preflight - resolve tested runner label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      label: ${{ steps.label.outputs.label }}
    steps:
      - name: Checkout for duplicate-admission check
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Refuse duplicate start while prior DevBox is alive
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ./scripts/guard-one-session.py

      - name: Resolve DEVBOX_RUNNER_LABEL against tested allowlist
        id: label
        shell: bash
        run: |
          set -euo pipefail
          RAW="${{ vars.DEVBOX_RUNNER_LABEL }}"
          if [ -z "$RAW" ]; then
            echo "DEVBOX FAILED: repo variable DEVBOX_RUNNER_LABEL is unset."
            echo "Next action: run probe-runners.yml once, then set the variable under"
            echo "Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          case "$RAW" in
            windows-2022|windows-2025|windows-2025-vs2026)
              echo "label=$RAW" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "DEVBOX FAILED: DEVBOX_RUNNER_LABEL '$RAW' is not in the tested allowlist."
              echo "Next action: set it to windows-2022, windows-2025 or windows-2025-vs2026."
              exit 1 ;;
          esac

  devbox:
    if: ${{ inputs.operation != 'inspect' }}
    name: DevBox session (${{ needs.preflight.outputs.label }})
    needs: preflight
    runs-on: ${{ needs.preflight.outputs.label }}
    environment: devbox
    timeout-minutes: 350
    concurrency:
      group: devbox-windows-session
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Refuse a queued duplicate before starting Windows setup
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python ./scripts/guard-one-session.py

      - name: Bootstrap workspace root and structure
        shell: pwsh
        run: ./scripts/bootstrap.ps1

      - name: Configure UK timezone (GMT/BST) and verify DST
        shell: pwsh
        run: ./scripts/configure-timezone.ps1

      - name: Check GitHub OIDC claims before Tailscale
        shell: pwsh
        env:
          TS_OAUTH_CLIENT_ID: ${{ env.DEVBOX_OIDC_CLIENT_ID }}
          TS_AUDIENCE: ${{ format('api.tailscale.com/{0}', env.DEVBOX_OIDC_CLIENT_ID) }}
        run: ./scripts/check-tailscale-oidc.ps1

      - name: Join tailnet (WIF/OIDC, ephemeral, tagged)
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ env.DEVBOX_OIDC_CLIENT_ID }}
          audience: ${{ format('api.tailscale.com/{0}', env.DEVBOX_OIDC_CLIENT_ID) }}
          tags: tag:github-devbox
          version: latest
          hostname: devbox-${{ github.run_id }}

      - name: Discover >=100 GiB workspace
        id: storage
        shell: pwsh
        run: ./scripts/discover-storage.ps1

      # Create Save/Finish on the Public Desktop BEFORE the first restore or
      # backup. If persistence is slow/fails, controls must still be visible.
      - name: Install Save and Finish buttons before persistence
        shell: pwsh
        run: ./scripts/install-desktop-controls.ps1

      - name: Install OpenCode (standalone Windows x64)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/install-opencode.ps1 -ToolsRoot "${{ steps.storage.outputs.fastRoot }}\DevBox\Tools"

      - name: Configure RDP (runneradmin preferred, NLA kept)
        shell: pwsh
        env:
          DEVBOX_RDP_PASSWORD: ${{ secrets.DEVBOX_RDP_PASSWORD }}
        run: |
          $secure = ConvertTo-SecureString -String $env:DEVBOX_RDP_PASSWORD -AsPlainText -Force
          ./scripts/configure-rdp.ps1 -Password $secure

      - name: Configure built-in terminal on the Tailscale address
        id: terminal
        continue-on-error: true
        shell: pwsh
        run: ./scripts/configure-terminal.ps1

      - name: Publish this run's public terminal host key
        if: ${{ steps.terminal.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: devbox-terminal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEVBOX_CONTROL_PATH }}/Terminal/manifest.json
          retention-days: 1
          if-no-files-found: error

      - name: Connect persistence (restic over Tailscale)
        shell: pwsh
        env:
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          DEVBOX_STORAGE_TAILSCALE_IP: '100.70.202.110'
          RESTIC_REST_USERNAME: devbox
          RESTIC_REST_PASSWORD: ${{ secrets.DEVBOX_STORAGE_PASSWORD }}
        run: ./scripts/connect-persistence.ps1

      - name: Restore state (HOT first, Git canonical, small overlay)
        shell: pwsh
        env:
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          RESTIC_REST_USERNAME: devbox
          RESTIC_REST_PASSWORD: ${{ secrets.DEVBOX_STORAGE_PASSWORD }}
        run: ./scripts/restore-state.ps1

      - name: First canary + backup proof
        shell: pwsh
        env:
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          RESTIC_REST_USERNAME: devbox
          RESTIC_REST_PASSWORD: ${{ secrets.DEVBOX_STORAGE_PASSWORD }}
        run: ./scripts/save-state.ps1 -First

      # The session manager is the LAST step. It first writes a heartbeat,
      # runs health checks, prints READY, then blocks until the session ends.
      # A background worker as an earlier Actions step would not keep the VM alive.
      - name: DevBox session (health, READY, periodic saves, graceful end)
        shell: pwsh
        env:
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          RESTIC_REST_USERNAME: devbox
          RESTIC_REST_PASSWORD: ${{ secrets.DEVBOX_STORAGE_PASSWORD }}
        run: ./scripts/session-manager.ps1 -JobStart


  terminal-relay:
    if: ${{ inputs.operation != 'inspect' }}
    name: Tailscale browser terminal relay
    needs: preflight
    runs-on: ubuntu-latest
    environment: devbox
    timeout-minutes: 350
    steps:
      - name: Checkout command client
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify original OIDC identity
        shell: pwsh
        env:
          TS_OAUTH_CLIENT_ID: ${{ env.DEVBOX_OIDC_CLIENT_ID }}
          TS_AUDIENCE: ${{ format('api.tailscale.com/{0}', env.DEVBOX_OIDC_CLIENT_ID) }}
        run: ./scripts/check-tailscale-oidc.ps1

      - name: Join the existing tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ env.DEVBOX_OIDC_CLIENT_ID }}
          audience: ${{ format('api.tailscale.com/{0}', env.DEVBOX_OIDC_CLIENT_ID) }}
          tags: tag:github-devbox
          version: latest
          hostname: devbox-terminal-${{ github.run_id }}

      - name: Prepare root-only Windows command client
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 -m venv /opt/devbox-terminal
          sudo /opt/devbox-terminal/bin/pip install --disable-pip-version-check paramiko==4.0.0
          sudo mkdir -p /opt/devbox-terminal/client
          sudo cp scripts/devbox_terminal.py scripts/terminal-relay.py /opt/devbox-terminal/client/
          printf '%s\n' '#!/bin/sh' 'exec /opt/devbox-terminal/bin/python /opt/devbox-terminal/client/devbox_terminal.py "$@"' | sudo tee /usr/local/bin/devbox >/dev/null
          sudo chmod 755 /usr/local/bin/devbox

      - name: Advertise Tailscale SSH
        shell: bash
        run: sudo tailscale set --ssh

      - name: Prove harmless Windows command and hold relay for this session
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEVBOX_RDP_PASSWORD: ${{ secrets.DEVBOX_RDP_PASSWORD }}
        run: sudo --preserve-env=GITHUB_TOKEN,GITHUB_REPOSITORY,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,DEVBOX_RDP_PASSWORD /opt/devbox-terminal/bin/python /opt/devbox-terminal/client/terminal-relay.py


  audit:
    # Tailscale's existing trust credential checks workflow_ref, which is
    # .github/workflows/devbox.yml@refs/heads/main. A separate diagnostic
    # workflow is unauthorized (observed HTTP 403 in run #38182979676).
    if: ${{ inputs.operation == 'inspect' }}
    name: Read-only OpenCode snapshot inventory
    runs-on: windows-2025-vs2026
    environment: devbox
    timeout-minutes: 15
    steps:
      - name: Checkout metadata-only inspector
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Verify original workflow OIDC identity before Tailnet join
        shell: pwsh
        env:
          TS_OAUTH_CLIENT_ID: ${{ env.DEVBOX_OIDC_CLIENT_ID }}
          TS_AUDIENCE: ${{ format('api.tailscale.com/{0}', env.DEVBOX_OIDC_CLIENT_ID) }}
        run: ./scripts/check-tailscale-oidc.ps1

      - name: Join tailnet for read-only inventory only
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ env.DEVBOX_OIDC_CLIENT_ID }}
          audience: ${{ format('api.tailscale.com/{0}', env.DEVBOX_OIDC_CLIENT_ID) }}
          tags: tag:github-devbox
          version: latest
          hostname: devbox-audit-${{ github.run_id }}

      - name: Inspect encrypted snapshot METADATA ONLY (never restore)
        shell: pwsh
        env:
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          RESTIC_REST_USERNAME: devbox
          RESTIC_REST_PASSWORD: ${{ secrets.DEVBOX_STORAGE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DEVBOX_WSROOT = Join-Path $env:RUNNER_TEMP 'ResticReadOnlyAudit'
          $env:DEVBOX_CONTROL_PATH = Join-Path $env:DEVBOX_WSROOT 'Control'
          New-Item -ItemType Directory -Path $env:DEVBOX_CONTROL_PATH -Force | Out-Null
          $tools = Join-Path $env:DEVBOX_WSROOT 'Tools\restic'
          ./scripts/install-restic.ps1 -ToolsRoot $tools
          $exe = Join-Path $tools 'restic.exe'
          python ./scripts/inspect-opencode-snapshots.py --restic-exe $exe --max-prior 30 --session-counts
          if ($LASTEXITCODE -ne 0) { throw 'Restic metadata inspection failed; no backup-content conclusions.' }

