# User-authorized isolated pilot retry, exact verified encrypted generation.
# Triggered by creation only; no schedules, no chained recovery or original DevBox.
name: One-time Windows Home SID-ACL corrected pilot restore
on:
  push:
    branches: [pilot/windows-home-connection-20261015]
    paths:
      - '.github/workflows/pilot-sid-acl-retry-one-shot.yml'
permissions:
  contents: read
jobs:
  dispatch:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/pilot/windows-home-connection-20261015' &&
      github.event.head_commit.message == 'chore(pilot): dispatch one ACL-verified Windows Home guest retry'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      actions: write
      contents: read
    steps:
      - name: Launch only the isolated manually held Windows 10 Home VM
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dougmcdonald87/dougs-box'
          test "$GITHUB_REF" = 'refs/heads/pilot/windows-home-connection-20261015'
          gh workflow run windows-state-probe-validate.yml \
            --repo "$GH_REPO" \
            --ref 'pilot/windows-home-connection-20261015' \
            --field transfer_phase=restore-hold \
            --field expected_generation='devbox-checkpoint-v1-ci-38647908553-1-20261014T225101Z-eb2366ef7dc34ea4aee45c30bbc721b6' \
            --field expected_source_sha=''
          echo 'PILOT_WINDOWS_SID_ACL_RETRY_DISPATCH_ACCEPTED=true'
