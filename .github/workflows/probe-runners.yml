name: Probe runners

# Manual, secret-free capacity probe. Run when needed (new image, new label, doubt).
# Output feeds the repo variable DEVBOX_RUNNER_LABEL via Settings > Variables.
# Never run automatically every session (Phase 7).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.image }}
    runs-on: ${{ matrix.image }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: [windows-2025-vs2026, windows-2022]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Hardware + storage + identity probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "== image $env:GITHUB_JOB ==" | Write-Output
          $os = Get-CimInstance Win32_OperatingSystem
          "OS          : $($os.Caption) build $($os.BuildNumber)" | Write-Output
          "CPU count # : $env:NUMBER_OF_PROCESSORS" | Write-Output
          "RAM GB      : $([math]::Round($os.TotalVisibleMemorySize/1MB,1))" | Write-Output
          "--- fixed volumes ---"
          Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' | ForEach-Object {
            "{0,2} total {1,8:N1} GiB  free {2,8:N1} GiB" -f $_.DeviceID, ($_.Size/1GB), ($_.FreeSpace/1GB)
          } | Write-Output
          "--- identity ---"
          "whoami      : $(whoami)" | Write-Output
          "runneradmin exists : $([bool](Get-LocalUser -Name 'runneradmin' -ErrorAction SilentlyContinue))" | Write-Output
          "--- RDP basics ---"
          $ts = Get-Service TermService -ErrorAction SilentlyContinue
          "TermService : $($ts.Status)" | Write-Output
          $nla = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -ErrorAction SilentlyContinue).UserAuthentication
          "NLA level   : $nla (2 = required)" | Write-Output
          "--- tool inventory ---"
          foreach ($t in 'git','python','node','pwsh','gh') {
            $c = Get-Command $t -ErrorAction SilentlyContinue
            "{0,-8}: {1}" -f $t, $(if ($c) { $c.Version ?? 'present' } else { 'MISSING' }) | Write-Output
          }
          "--- storage verdict ---"
          $best = Get-CimInstance Win32_LogicalDisk -Filter 'DriveType=3' |
            Where-Object { $_.FreeSpace/1GB -ge 100 } | Sort-Object FreeSpace -Descending | Select-Object -First 1
          if ($best) { "QUALIFYING workspace volume: $($best.DeviceID) with $([math]::Round($best.FreeSpace/1GB,1)) GiB free." }
          else       { "NOTE: no >=100 GiB local volume on this image (probe fact, not a failure)." }
