# One-time user-approved pilot Windows GUI test. NOT part of original DevBox.
# No recurring triggers, no run re-dispatch, no original main branch.
name: Pilot Windows Home one-time launch
on:
  push:
    branches:
      - pilot/windows-home-connection-20261015
    paths:
      - '.github/workflows/pilot-windows-restore-one-shot.yml'
permissions:
  contents: read
jobs:
  launch:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/pilot/windows-home-connection-20261015' &&
      github.event.head_commit.message == 'chore(pilot): launch approved one-time isolated Windows Home restore'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch exactly one isolated Windows Home restore with pinned snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'dougmcdonald87/dougs-box'
          test "$GITHUB_REF" = 'refs/heads/pilot/windows-home-connection-20261015'
          gh workflow run 'windows-state-probe-validate.yml' \
            --repo "$GH_REPO" \
            --ref 'pilot/windows-home-connection-20261015' \
            --field transfer_phase=restore-hold \
            --field expected_generation='devbox-checkpoint-v1-ci-38647908553-1-20261014T225101Z-eb2366ef7dc34ea4aee45c30bbc721b6' \
            --field expected_source_sha=''
          echo 'PILOT_WINDOWS_HOME_RESTORE_DISPATCH_ACCEPTED=true'
