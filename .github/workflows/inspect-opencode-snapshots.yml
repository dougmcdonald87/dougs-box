name: Inspect OpenCode Snapshots (Read Only)

# MANUAL ONLY. An independent short-lived probe, NOT another DevBox session.
# No RDP, no workspace changes, no restore, no repository mutation, no deletion.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    name: Lenovo Restic metadata only
    runs-on: windows-2025-vs2026
    environment: devbox
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Temporary Tailnet access for read-only probe
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: 'Tf3m25iN2121CNTRL-k1fB6QfG2V11CNTRL'
          audience: 'api.tailscale.com/Tf3m25iN2121CNTRL-k1fB6QfG2V11CNTRL'
          tags: tag:github-devbox
          version: latest
          hostname: devbox-audit-${{ github.run_id }}

      - name: Inspect old and new encrypted snapshot metadata (NO restore)
        shell: pwsh
        env:
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          RESTIC_REST_USERNAME: devbox
          RESTIC_REST_PASSWORD: ${{ secrets.DEVBOX_STORAGE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DEVBOX_WSROOT = Join-Path $env:RUNNER_TEMP 'ResticReadOnlyAudit'
          $env:DEVBOX_CONTROL_PATH = Join-Path $env:DEVBOX_WSROOT 'Control'
          New-Item -ItemType Directory -Path $env:DEVBOX_CONTROL_PATH -Force | Out-Null
          $tools = Join-Path $env:DEVBOX_WSROOT 'Tools\\restic'
          ./scripts/install-restic.ps1 -ToolsRoot $tools
          $exe = Join-Path $tools 'restic.exe'
          python ./scripts/inspect-opencode-snapshots.py --restic-exe $exe --max-prior 18
          if ($LASTEXITCODE -ne 0) { throw 'Metadata inventory failed: no claims about saved files.' }
