name: GitHub persistence candidate validation
on:
  pull_request:
    paths:
      - 'scripts/cloud_checkpoint.py'
      - 'scripts/cloud-persistence.ps1'
      - 'scripts/save-state.ps1'
      - 'scripts/connect-persistence.ps1'
      - 'scripts/common.ps1'
      - 'scripts/health-check.ps1'
      - 'scripts/control-queue.ps1'
      - 'scripts/restore-state.ps1'
      - 'scripts/verified-snapshot.ps1'
      - 'tests/cloud-checkpoint.tests.py'
      - 'tests/cloud-persistence.tests.ps1'
      - '.github/workflows/github-persistence-validate.yml'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/cloud-checkpoint.tests.py
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    environment: devbox
    permissions:
      contents: write
    timeout-minutes: 15
    outputs:
      generation: ${{ steps.save.outputs.generation }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: save
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
        run: ./tests/cloud-persistence.tests.ps1 -Mode Capture
  restore:
    needs: capture
    runs-on: windows-2025
    environment: devbox
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          DEVBOX_CLOUD_EXPECTED_GENERATION: ${{ needs.capture.outputs.generation }}
        run: ./tests/cloud-persistence.tests.ps1 -Mode Restore
