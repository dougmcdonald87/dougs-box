name: Windows Home persistence probe guards
on:
  pull_request:
    paths:
      - 'scripts/windows-state-probe.ps1'
      - 'tests/windows-state-probe*'
      - 'tests/windows-state-disk*'
      - 'tests/windows-state-install*'
      - 'tests/windows-state-guest*'
      - 'scripts/windows-state-fixture.ps1'
      - 'scripts/windows-state-capacity.ps1'
      - 'scripts/windows_state_manifest.py'
      - 'scripts/windows_state_transfer.py'
      - 'scripts/windows-state-roundtrip.ps1'
      - 'tests/windows-state-roundtrip.tests.ps1'
      - 'tests/windows-state-package.native.ps1'
      - 'tests/windows-state-transfer.tests.py'
      - 'scripts/windows-state-checkpoint.ps1'
      - 'tests/windows-state-checkpoint*'
      - 'tests/windows-state-capacity*'
      - 'tests/reserved-variable.tests.ps1'
      - '.github/workflows/windows-state-probe-validate.yml'
  workflow_dispatch:
    inputs:
      transfer_phase:
        description: 'Isolated native probe, encrypted whole Windows producer, or independently fresh restore'
        type: choice
        options: [operator-acceptance, cold-restore-verification, native-compatibility, probe, publish, restore, restore-hold, tailnet-preflight, transport-probe, operator, process-probe, artifact-probe, restricted-agent-probe, live-host-probe, restore-live-save-probe, owner-policy-tests, guest-network-probe]
        default: probe
      transport_full_part:
        description: 'Use a full512MiB random non-user probe payload instead of32bytes'
        type: boolean
        default: false
      expected_generation:
        description: 'Exact previously accepted CI generation; required only for fresh restore'
        type: string
        default: ''
      expected_source_sha:
        description: 'Pinned producer commit SHA for interactive recovery, not needed for original seed'
        type: string
        default: ''
      media_uri:
        description: 'Optional owner-selected official Microsoft ISO URL for native media verification'
        type: string
        default: ''
      media_sha256:
        description: 'Microsoft published ISO SHA256'
        type: string
        default: ''
      install_image:
        description: 'Apply verified Home to only the owned disposable VHDX and test initial boot'
        type: boolean
        default: false
      fixture:
        description: 'Complete isolated local account setup and test actual program/document/settings across two boots'
        type: boolean
        default: false
      checkpoint_roundtrip:
        description: 'Test running production Save and clean Finish exports, same-ID local imports and point-in-time fixtures'
        type: boolean
        default: false
      vss_attack:
        description: 'Require native Save refusal with guest VSS disabled and preservation of prior export'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  probe:
    if: github.event_name != 'workflow_dispatch' || inputs.transfer_phase == 'probe'
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    env:
      DEVBOX_ISOLATED_TEST: '1'
      WINDOWS_STATE_MEDIA_URI: ${{ github.event_name == 'workflow_dispatch' && inputs.media_uri || '' }}
      WINDOWS_STATE_MEDIA_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.media_sha256 || '' }}
      WINDOWS_STATE_INSTALL_IMAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.install_image || false }}
      WINDOWS_STATE_FIXTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.fixture || false }}
      WINDOWS_STATE_VSS_ATTACK: ${{ github.event_name == 'workflow_dispatch' && inputs.vss_attack || false }}
      WINDOWS_STATE_CHECKPOINT_ROUNDTRIP: ${{ github.event_name == 'workflow_dispatch' && inputs.checkpoint_roundtrip || false }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Refuse reserved PowerShell HOME assignments
        shell: pwsh
        run: ./tests/reserved-variable.tests.ps1
      - name: Test ownership refusals and Windows Home hardware policy
        shell: pwsh
        run: ./tests/windows-state-probe.tests.ps1
      - name: Test guest disk ownership and refusal boundaries
        shell: pwsh
        run: ./tests/windows-state-disk.tests.ps1
      - name: Refuse host and existing disks before Windows installation
        shell: pwsh
        run: ./tests/windows-state-install.tests.ps1
      - name: Refuse forged host sessions before guest fixture writes
        shell: pwsh
        run: ./tests/windows-state-guest.tests.ps1
      - name: Refuse foreign whole-guest capacity export roots
        shell: pwsh
        run: ./tests/windows-state-capacity.tests.ps1
      - name: Verify whole VM corruption identity parent and consistency refusals
        shell: pwsh
        run: python ./tests/windows-state-checkpoint.tests.py
      - name: Refuse writes and wrong generations during fresh-host recovery
        shell: pwsh
        run: python ./tests/windows-state-transfer.tests.py
      - name: Verify portable isolated fixture credential boundaries
        shell: pwsh
        run: ./tests/windows-state-roundtrip.tests.ps1
      - name: Verify real small-file encrypted package canary and durable receipt
        shell: pwsh
        run: ./tests/windows-state-package.native.ps1
      - name: Refuse foreign whole VM checkpoint roots
        shell: pwsh
        run: ./tests/windows-state-checkpoint.tests.ps1
      - name: Start and remove only the owned empty VM on disposable Windows
        shell: pwsh
        run: ./tests/windows-state-probe.native.ps1

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.transfer_phase == 'publish'
    runs-on: windows-2025-vs2026
    environment: devbox
    permissions:
      contents: write
    timeout-minutes: 60
    env:
      DEVBOX_ISOLATED_TEST: '1'
      GH_TOKEN: ${{ github.token }}
      RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
      WINDOWS_STATE_TRANSFER_MODE: publish
      WINDOWS_STATE_MEDIA_URI: ${{ inputs.media_uri }}
      WINDOWS_STATE_MEDIA_SHA256: ${{ inputs.media_sha256 }}
      WINDOWS_STATE_INSTALL_IMAGE: 'true'
      WINDOWS_STATE_FIXTURE: 'true'
      WINDOWS_STATE_CHECKPOINT_ROUNDTRIP: 'true'
      WINDOWS_STATE_VSS_ATTACK: 'true'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify actual Windows Save and Finish recovery then publish encrypted checkpoint
        shell: pwsh
        run: ./tests/windows-state-probe.native.ps1
  restore:
    if: github.event_name == 'workflow_dispatch' && inputs.transfer_phase == 'restore'
    runs-on: windows-2025-vs2026
    environment: devbox
    timeout-minutes: 45
    env:
      DEVBOX_ISOLATED_TEST: '1'
      GH_TOKEN: ${{ github.token }}
      RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
      EXPECTED_WINDOWS_STATE_GENERATION: ${{ inputs.expected_generation }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Restore exact checkpoint on independently fresh host and execute real acceptance fixture
        shell: pwsh
        run: |
          . ./scripts/windows-state-roundtrip.ps1
          $result=Restore-WindowsStateRoundtrip -ExpectedGeneration $env:EXPECTED_WINDOWS_STATE_GENERATION
          Write-Output ('NATIVE INDEPENDENT FRESH HOST WINDOWS RESTORE: '+($result|ConvertTo-Json -Depth 5 -Compress))

  transport-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.transfer_phase == 'transport-probe'
    runs-on: windows-2025-vs2026
    environment: devbox
    permissions:
      contents: write
    timeout-minutes: 15
    env:
      DEVBOX_ISOLATED_TEST: '1'
      GH_TOKEN: ${{ github.token }}
      WINDOWS_STATE_TRANSPORT_FULL_PART: ${{ inputs.transport_full_part }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Reproduce draft creation and tiny readback with safe transport diagnostics
        shell: pwsh
        run: python ./tests/windows-state-transport.native.py


  operator:
    if: github.event_name == 'workflow_dispatch' && inputs.transfer_phase == 'operator'
    runs-on: windows-2025-vs2026
    environment: windows-home-pilot
    timeout-minutes: 340
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Configure pilot RDP from environment secret (never print password)
        shell: pwsh
        env:
          PILOT_RDP_PASSWORD: ${{ secrets.PILOT_RDP_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          if ([string]::IsNullOrWhiteSpace($env:PILOT_RDP_PASSWORD)) {
            throw 'Pilot RDP password not configured in windows-home-pilot Environment.'
          }
          $env:DEVBOX_CONTROL_PATH = Join-Path $env:RUNNER_TEMP 'windows-home-pilot-rdp'
          New-Item -Path $env:DEVBOX_CONTROL_PATH -ItemType Directory -Force | Out-Null
          $secure = ConvertTo-SecureString -String $env:PILOT_RDP_PASSWORD -AsPlainText -Force
          ./scripts/configure-rdp.ps1 -Password $secure
          Remove-Variable secure -ErrorAction SilentlyContinue
          Write-Output 'PILOT: RDP startup script finished; login remains the GitHub Environment secret.'

      - name: Install official artifact SDK for disposable device action
        shell: pwsh
        run: |
          npm install --prefix .github/actions/pilot-device --no-save --ignore-scripts --no-audit --no-fund @actions/artifact@6.3.1
          if($LASTEXITCODE -ne 0){throw 'Official SDK installation failed.'}
      - name: Start outbound independent Desktop Commander session and publish encrypted pairing
        uses: ./.github/actions/pilot-device
        env:
          PILOT_RSA_MODULUS: ''

  process-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.transfer_phase == 'process-probe'
    runs-on: windows-2025-vs2026
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Launch harmless tracked and untracked sleepers
        shell: pwsh
        id: launch
        run: |
          $ErrorActionPreference='Stop'
          $sleepScript='Start-Sleep -Seconds 120'
          $tracked=Start-Process -FilePath (Get-Command pwsh).Source -ArgumentList '-NoProfile','-NonInteractive','-Command',$sleepScript -PassThru -WindowStyle Hidden
          $env:RUNNER_TRACKING_ID=''
          $untracked=Start-Process -FilePath (Get-Command pwsh).Source -ArgumentList '-NoProfile','-NonInteractive','-Command',$sleepScript -PassThru -WindowStyle Hidden
          Write-Output ("TRACKED_STARTED="+$tracked.Id+";UNTRACKED_STARTED="+$untracked.Id)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('tracked='+$tracked.Id)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('untracked='+$untracked.Id)
      - name: Falsify runner step-process cleanup theory
        shell: pwsh
        env:
          TRACKED_ID: ${{ steps.launch.outputs.tracked }}
          UNTRACKED_ID: ${{ steps.launch.outputs.untracked }}
        run: |
          $tracked=Get-Process -Id ([int]$env:TRACKED_ID) -ErrorAction SilentlyContinue
          $untracked=Get-Process -Id ([int]$env:UNTRACKED_ID) -ErrorAction SilentlyContinue
          Write-Output ('RUNNER_TRACKED_SURVIVED='+[bool]$tracked)
          Write-Output ('RUNNER_UNTRACKED_SURVIVED='+[bool]$untracked)
          if($tracked){Stop-Process -Id $tracked.Id -ErrorAction SilentlyContinue}
          if($untracked){Stop-Process -Id $untracked.Id -ErrorAction SilentlyContinue}

  artifact-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.transfer_phase == 'artifact-probe'
    runs-on: windows-2025-vs2026
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Prepare official artifact SDK inside disposable runner
        shell: pwsh
        run: |
          npm install --prefix .github/actions/pilot-midstep --no-save --ignore-scripts --no-audit --no-fund @actions/artifact@6.3.1
          if($LASTEXITCODE -ne 0){throw 'Official SDK installation failed.'}
      - name: Publish harmless dummy artifact from within one running Node action
        uses: ./.github/actions/pilot-midstep

  tailnet-preflight:
    name: Pilot tailnet connection preflight (no VM)
    if: github.event_name == 'workflow_dispatch' && inputs.transfer_phase == 'tailnet-preflight'
    runs-on: ubuntu-latest
    environment: devbox
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      DEVBOX_ISOLATED_TEST: '1'
      PILOT_TAILSCALE_OIDC_CLIENT_ID: 'Tf3m25iN2121CNTRL-k9nitZxGTS11CNTRL'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Test pilot-only workflow policy
        shell: bash
        run: |
          python3 ./tests/windows-home-tailnet-preflight.tests.py
          python3 ./tests/windows-home-tailnet-policy.tests.py
      - name: Check GitHub OIDC identity for this pilot
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REF -cne 'refs/heads/pilot/windows-home-connection-20261015'){throw 'Wrong branch.'}
          ./scripts/windows-home-tailnet-oidc.ps1 -ClientId $env:PILOT_TAILSCALE_OIDC_CLIENT_ID
      - name: Join isolated tailnet using the dedicated pilot identity
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd
        with:
          oauth-client-id: ${{ env.PILOT_TAILSCALE_OIDC_CLIENT_ID }}
          audience: ${{ format('api.tailscale.com/{0}', env.PILOT_TAILSCALE_OIDC_CLIENT_ID) }}
          tags: tag:windows-home-pilot
          version: latest
          hostname: windows-home-pilot-smoke-${{ github.run_id }}
      - name: Verify private Tailscale IPv4 without Windows or RDP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ips=@(& tailscale ip -4)
          if($LASTEXITCODE -ne 0){throw 'Pilot tailnet address unavailable.'}
          $valid=@($ips|Where-Object {$_ -match '^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}$'})
          if($valid.Count -ne 1){throw 'Expected exactly one tailnet IPv4.'}
          Write-Output ('PILOT_TAILNET_PREFLIGHT_OK='+$valid[0])

      - name: Read only the replacement host address and connection ports
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import ipaddress,json,socket,subprocess
          target='windows-home-pilot-38969952512'
          state=json.loads(subprocess.check_output(['tailscale','status','--json']))
          peers=[p for p in state.get('Peer',{}).values() if p.get('DNSName','').split('.')[0]==target or p.get('HostName')==target]
          if len(peers)!=1:raise SystemExit('Expected exactly one replacement pilot peer; no other device probed.')
          ips=[s for s in peers[0].get('TailscaleIPs',[]) if ':' not in s]
          if len(ips)!=1 or ipaddress.ip_address(ips[0]) not in ipaddress.ip_network('100.64.0.0/10'):raise SystemExit('Replacement private address refused.')
          ports={}
          for port in (3389,5985):
              try:
                  with socket.create_connection((ips[0],port),timeout=5):ports[str(port)]=True
              except OSError:ports[str(port)]=False
          print('PILOT_REPLACEMENT_CONNECTION='+json.dumps({'runId':'38969952512','hostname':target,'ip':ips[0],'ports':ports}),flush=True)
          if not ports['3389']:raise SystemExit('Replacement RDP endpoint not yet reachable.')
          PYTHON

  restore-hold:
    if: github.event_name == 'workflow_dispatch' && inputs.transfer_phase == 'restore-hold' && github.ref == 'refs/heads/pilot/windows-home-connection-20261015'
    runs-on: windows-2025-vs2026
    environment: devbox
    timeout-minutes: 340
    permissions:
      actions: read
      contents: write # only this manual pilot job can publish a new immutable CI checkpoint
      id-token: write # only the dedicated, workflow-pinned pilot tailnet identity
    env:
      DEVBOX_ISOLATED_TEST: '1'
      # Tailscale Client IDs are public identifiers, not access tokens.
      PILOT_TAILSCALE_OIDC_CLIENT_ID: 'Tf3m25iN2121CNTRL-k9nitZxGTS11CNTRL'
      EXPECTED_WINDOWS_STATE_GENERATION: ${{ inputs.expected_generation }}
      EXPECTED_WINDOWS_STATE_SOURCE_SHA: ${{ inputs.expected_source_sha }}
    steps:
      - name: Anchor publication budget to actual workflow start
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $raw=& gh api ('repos/'+$env:GITHUB_REPOSITORY+'/actions/runs/'+$env:GITHUB_RUN_ID)
          if($LASTEXITCODE -ne 0){throw 'Actual workflow start unavailable.'}
          $run=($raw -join "`n")|ConvertFrom-Json
          if($run.head_sha -cne $env:GITHUB_SHA -or $run.event -cne 'workflow_dispatch'){throw 'Workflow budget identity mismatch.'}
          $stop=([DateTimeOffset]::Parse($run.run_started_at)).AddMinutes(325).ToUnixTimeMilliseconds()
          if($stop -le ([DateTimeOffset]::UtcNow.AddMinutes(45).ToUnixTimeMilliseconds())){throw 'Insufficient remaining workflow budget.'}
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('WINDOWS_HOME_HOST_STOP_MS='+$stop)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify dedicated pilot tailnet OIDC identity before Windows restore
        shell: pwsh
        env:
          PILOT_TAILSCALE_OIDC_CLIENT_ID: ${{ env.PILOT_TAILSCALE_OIDC_CLIENT_ID }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:PILOT_TAILSCALE_OIDC_CLIENT_ID)){
            throw 'Dedicated pilot Tailscale WIF credential unavailable. Original DevBox main-branch trust MUST NOT be reused.'
          }
          ./scripts/windows-home-tailnet-oidc.ps1 -ClientId $env:PILOT_TAILSCALE_OIDC_CLIENT_ID
      - name: Join tailnet using separate isolated pilot credential
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ env.PILOT_TAILSCALE_OIDC_CLIENT_ID }}
          audience: ${{ format('api.tailscale.com/{0}', env.PILOT_TAILSCALE_OIDC_CLIENT_ID) }}
          tags: tag:windows-home-pilot
          version: latest
          hostname: windows-home-pilot-${{ github.run_id }}
      - name: Fail closed if isolated tailnet address unavailable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ipOutput=@(& tailscale ip -4)
          if($LASTEXITCODE -ne 0){throw 'Pilot tailnet identity not connected.'}
          $ip=@($ipOutput|Where-Object {$_ -match '^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}$'})
          if($ip.Count -ne 1){throw 'Expected exactly one private Tailscale IPv4 address.'}
          Write-Output ('ISOLATED_PILOT_TAILSCALE_IP='+$ip[0])
      - name: Ensure Windows Home Hyper-V graphical console without guest restore
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/ensure-windows-home-vmconnect.ps1
      - name: Configure pilot RDP using existing devbox environment secret
        shell: pwsh
        env:
          DEVBOX_RDP_PASSWORD: ${{ secrets.DEVBOX_RDP_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrWhiteSpace($env:DEVBOX_RDP_PASSWORD)){throw 'Existing RDP secret unavailable.'}
          $env:DEVBOX_CONTROL_PATH=Join-Path $env:RUNNER_TEMP 'windows-home-restore-hold-rdp'
          New-Item -Path $env:DEVBOX_CONTROL_PATH -ItemType Directory -Force | Out-Null
          ./scripts/configure-rdp.ps1 -Password (ConvertTo-SecureString $env:DEVBOX_RDP_PASSWORD -AsPlainText -Force)
      - name: Refuse bootstrap RDP account receipt path regression before expensive restore
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./tests/windows-state-source-parse.tests.ps1
          ./tests/windows-state-restore-receipt.tests.ps1
          ./tests/windows-state-import-network.tests.ps1
          python ./tests/windows-home-rdp-receipt.tests.py
          if($LASTEXITCODE -ne 0){throw 'Pilot RDP receipt cross-step path tests failed; guest restore forbidden.'}
          python ./tests/windows-home-sid-acl.tests.py
          if($LASTEXITCODE -ne 0){throw 'Pilot SID-based control directory ACL regression test failed; guest restore forbidden.'}
          python ./tests/windows-home-guest-owner.tests.py
          if($LASTEXITCODE -ne 0){throw 'Guest owner account security/sequence tests failed before restore.'}
      - name: Establish independently authenticated repair access before expensive restore
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($test in @('./tests/windows-home-session-budget.tests.ps1','./tests/windows-home-repair-access.tests.ps1','./tests/windows-state-repair-retention.tests.ps1','./tests/windows-state-repair-resume.tests.ps1','./tests/windows-home-guest-transport.tests.ps1','./tests/windows-home-guest-receipts.tests.ps1','./tests/windows-home-guest-batch.tests.ps1')){
            & pwsh -NoProfile -File $test
            if($LASTEXITCODE -ne 0){throw ('Repair guard failed: '+$test)}
          }
          ./scripts/windows-home-repair-access.ps1
      - name: Prepare internal switch before interactive recovery
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $switches=@(Get-VMSwitch -Name 'nat' -ErrorAction SilentlyContinue)
          if(-not $switches.Count){New-VMSwitch -Name 'nat' -SwitchType Internal -ErrorAction Stop|Out-Null}
          $switches=@(Get-VMSwitch -Name 'nat' -ErrorAction Stop)
          if($switches.Count -ne 1 -or $switches[0].SwitchType.ToString() -cne 'Internal'){throw 'Interactive recovery requires exact internal nat switch.'}
      - name: Restore, boot and verify isolated Windows 10 Home guest without deleting verified VM
        id: restore_guest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          DEVBOX_RDP_PASSWORD: ${{ secrets.DEVBOX_RDP_PASSWORD }}
        run: |
          $ErrorActionPreference='Stop'
          $env:DEVBOX_CONTROL_PATH=Join-Path $env:RUNNER_TEMP 'windows-home-restore-hold-rdp'
          if($env:GITHUB_REF -cne 'refs/heads/pilot/windows-home-connection-20261015'){throw 'Only manual isolated pilot branch may restore and offer operator controls.'}
          $seed='devbox-checkpoint-v1-ci-38647908553-1-20261014T225101Z-eb2366ef7dc34ea4aee45c30bbc721b6'
          $sha=if($env:EXPECTED_WINDOWS_STATE_GENERATION -ceq $seed){'5f13bc6fa567fdcdea5342a7481cb679a4a8b5e9'}else{$env:EXPECTED_WINDOWS_STATE_SOURCE_SHA}
          if($sha -cnotmatch '^[0-9a-f]{40}$'){throw 'Interactive restore requires explicitly pinned producer SHA.'}
          . ./scripts/windows-state-roundtrip.ps1
          try {
            $parts=@(Restore-WindowsStateRoundtrip -ExpectedGeneration $env:EXPECTED_WINDOWS_STATE_GENERATION -HoldForOperator -ExpectedSourceSha $sha -KeepForRepair)
          $result=@(Get-WindowsStateFreshRestoreReceipt -Parts $parts)
          if($result.Count -ne 1){throw 'Verified guest restore result missing or ambiguous.'}
          $vm=$result[0]
          ./scripts/windows-home-owner-account.ps1 -VmId ([guid]$vm.vmId) -Root $vm.root -OriginGeneration $vm.originGeneration
          ./scripts/windows-home-console.ps1 -Root $vm.root -VmId ([guid]$vm.vmId) -ExpectedGeneration $vm.generation -OriginGeneration $vm.originGeneration
          $controlDir=Join-Path $env:ProgramData ('WindowsHomePilot\'+$env:GITHUB_RUN_ID)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('control_dir='+$controlDir)
          Write-Output ('ISOLATED_VERIFIED_WINDOWS_HOME_VM='+$vm.vmId)
          } catch {
            $failure=$_
            $diagnosticDir=Join-Path $env:ProgramData ('WindowsHomeRecovery/'+$env:GITHUB_RUN_ID)
            New-Item -ItemType Directory -Path $diagnosticDir -Force|Out-Null
            [ordered]@{schema=1;runId=$env:GITHUB_RUN_ID;generation=$env:EXPECTED_WINDOWS_STATE_GENERATION;sourceSha=$sha;message=$failure.Exception.Message;stack=$failure.ScriptStackTrace;utc=[DateTime]::UtcNow.ToString('o')}|ConvertTo-Json -Depth 5|Set-Content -LiteralPath (Join-Path $diagnosticDir 'failure.json') -Encoding utf8
            Write-Host 'PILOT_RECOVERY_FAILURE_DIAGNOSTIC_HOLD_SECONDS=7200'
            Write-Host ('PILOT_RECOVERY_FAILURE_CLASS='+$failure.Exception.GetType().FullName)
            $holdUntil=[DateTime]::UtcNow.AddMinutes(120)
            $resumeRequest=Join-Path $env:ProgramData ('WindowsHomePilotRepair/'+$env:GITHUB_RUN_ID+'/resume.json')
            $repaired=$false
            while([DateTime]::UtcNow -lt $holdUntil){
              if(Test-Path -LiteralPath $resumeRequest){
                $claim=$resumeRequest+'.working-'+[guid]::NewGuid().ToString('N')
                try {
                  Move-Item -LiteralPath $resumeRequest -Destination $claim -ErrorAction Stop
                  $requestFile=Get-Item -LiteralPath $claim -Force
                  if($requestFile.PSIsContainer -or ($requestFile.Attributes -band [IO.FileAttributes]::ReparsePoint) -or $requestFile.Length -gt 4096){throw 'Unsafe resume request file refused.'}
                  $request=Get-Content -LiteralPath $claim -Raw|ConvertFrom-Json
                  if($request.schema -ne 1 -or $request.runId -cne $env:GITHUB_RUN_ID -or $request.operation -cne 'Resume' -or $request.generation -cne $env:EXPECTED_WINDOWS_STATE_GENERATION -or $request.sourceSha -cne $sha){throw 'Retained repair resume request refused.'}
                  $parts=@(Resume-WindowsStateRecovery -ExpectedGeneration $env:EXPECTED_WINDOWS_STATE_GENERATION -ExpectedSourceSha $sha)
                  $vm=Get-WindowsStateFreshRestoreReceipt -Parts $parts
                  ./scripts/windows-home-owner-account.ps1 -VmId ([guid]$vm.vmId) -Root $vm.root -OriginGeneration $vm.originGeneration
                  ./scripts/windows-home-console.ps1 -Root $vm.root -VmId ([guid]$vm.vmId) -ExpectedGeneration $vm.generation -OriginGeneration $vm.originGeneration
                  $controlDir=Join-Path $env:ProgramData ('WindowsHomePilot/'+$env:GITHUB_RUN_ID)
                  Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value ('control_dir='+$controlDir)
                  $repaired=$true;break
                } catch {
                  [ordered]@{schema=1;runId=$env:GITHUB_RUN_ID;message=$_.Exception.Message;stack=$_.ScriptStackTrace;utc=[DateTime]::UtcNow.ToString('o')}|ConvertTo-Json -Depth 5|Set-Content -LiteralPath (Join-Path $diagnosticDir 'resume-failure.json') -Encoding utf8
                  Write-Host 'PILOT_REPAIR_RESUME_FAILED_HOST_RETAINED=true'
                }
              }
              Start-Sleep -Seconds 5
            }
            if(-not $repaired){throw $failure}
          }
      - name: Prepare artifact SDK for same-runner restricted terminal pairing
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm install --prefix .github/actions/pilot-device --no-save --ignore-scripts --no-audit --no-fund @actions/artifact@6.3.1
          if($LASTEXITCODE -ne 0){throw 'Official pilot artifact SDK unavailable.'}
      - name: Hold guest and pair restricted terminal with first-party Save Finish
        shell: pwsh
        env:
          WINDOWS_HOME_CONTROL_DIR: ${{ steps.restore_guest.outputs.control_dir }}
          GH_TOKEN: ${{ github.token }}
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          PILOT_RSA_MODULUS: ''
        run: |
          $ErrorActionPreference='Stop'
          node .github/actions/pilot-device/supervise-restricted.mjs
          if($LASTEXITCODE -ne 0){throw 'Restricted terminal / first-party Save Finish supervision failed.'}

