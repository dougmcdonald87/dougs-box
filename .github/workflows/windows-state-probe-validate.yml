  cold-restore-verification:
    if: github.event_name == 'workflow_dispatch' && inputs.transfer_phase == 'cold-restore-verification' && github.ref == 'refs/heads/pilot/windows-home-connection-20261015'
    runs-on: windows-2025-vs2026
    environment: devbox
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      DEVBOX_ISOLATED_TEST: '1'
      GH_TOKEN: ${{ github.token }}
      RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Check guarded import and native-memory failure cases
        shell: pwsh
        run: |
          ./tests/windows-state-import-network.tests.ps1
          ./tests/windows-state-planned-memory.tests.ps1
      - name: Prepare internal switch before expensive recovery
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $switches=@(Get-VMSwitch -Name 'nat' -ErrorAction SilentlyContinue)
          if(-not $switches.Count){New-VMSwitch -Name 'nat' -SwitchType Internal -ErrorAction Stop|Out-Null}
          $switches=@(Get-VMSwitch -Name 'nat' -ErrorAction Stop)
          if($switches.Count -ne 1 -or $switches[0].SwitchType.ToString() -cne 'Internal'){throw 'Cold verification requires exact internal nat switch.'}
          Write-Host 'COLD_INTERNAL_SWITCH_READY=true'
      - name: Verify real saved Windows C on fresh host without RDP or desktop tools
        shell: pwsh
        env:
          EXPECTED_GENERATION: ${{ inputs.expected_generation }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          $ErrorActionPreference='Stop'
          . ./scripts/windows-state-roundtrip.ps1
          $parts=@(Restore-WindowsStateRoundtrip -ExpectedGeneration $env:EXPECTED_GENERATION -ExpectedSourceSha $env:EXPECTED_SOURCE_SHA -HoldForOperator)
          $result=@(Get-WindowsStateFreshRestoreReceipt -Parts $parts)
          if($result.Count -ne 1){throw 'Verified restore result absent.'}
          Write-Host ('COLD_RESTORE_VERIFIED='+($result[0]|ConvertTo-Json -Depth 7 -Compress))
          $id=[guid]$result[0].vmId
          $credential=Get-WindowsStatePortableFixtureCredential -VmId $id
          $session=New-PSSession -VMId $id -Credential $credential -ErrorAction Stop
          try {
            $volumes=Invoke-Command -Session $session -ScriptBlock {Get-CimInstance Win32_LogicalDisk|Select-Object DeviceID,DriveType,ProviderName,VolumeName}
            Write-Host ('GUEST_VOLUME_INVENTORY='+($volumes|ConvertTo-Json -Depth 4 -Compress))
            if(@($volumes|Where-Object {$_.DriveType -eq 4 -or $_.ProviderName}).Count){throw 'Guest has an unexpected network drive.'}
            if(@($volumes|Where-Object {$_.DriveType -eq 3 -and $_.DeviceID -cne 'C:'}).Count){throw 'Guest has an unexpected additional fixed drive.'}
          } finally {Remove-PSSession $session}
          Stop-VM -VM (Get-VM -Id $id -ErrorAction Stop) -ErrorAction Stop
          if((Get-VM -Id $id -ErrorAction Stop).State -ne 'Off'){throw 'Verification guest shutdown unconfirmed.'}

